<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkedIn Manager — Sebastián Levin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-0:#07080c;--bg-1:#0b0d14;--bg-2:#11141e;--bg-3:#171b28;--bg-hover:#1e2333;
  --glass-bg:rgba(23,27,40,.6);--glass-border:rgba(255,255,255,.08);--glass-border-strong:rgba(255,255,255,.14);
  --text-0:#f5f7fb;--text-1:#c7ccda;--text-2:#8a91a6;--text-3:#565d73;
  --neon-blue:#4f8cff;--neon-purple:#a855f7;--neon-cyan:#22d3ee;--neon-pink:#f472b6;--neon-green:#34d399;--neon-amber:#fbbf24;--neon-red:#f87171;
  --grad-primary:linear-gradient(135deg,#4f8cff 0%,#a855f7 100%);
  --grad-secondary:linear-gradient(135deg,#22d3ee 0%,#4f8cff 100%);
  --grad-success:linear-gradient(135deg,#34d399 0%,#22d3ee 100%);
  --grad-warm:linear-gradient(135deg,#f472b6 0%,#fbbf24 100%);
  --grad-glow:radial-gradient(circle at 20% 20%,rgba(79,140,255,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 50%);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --shadow-glow-blue:0 0 24px rgba(79,140,255,.35);--shadow-glow-purple:0 0 24px rgba(168,85,247,.35);
  --sidebar-w:260px;--topbar-h:72px;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --ease-out:cubic-bezier(.22,1,.36,1);--t-fast:150ms;--t-med:280ms;--t-slow:500ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg-0);color:var(--text-0);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:var(--grad-glow);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,var(--bg-1),var(--bg-0));border-right:1px solid var(--glass-border);display:flex;flex-direction:column;padding:24px 16px 16px;position:relative}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--neon-blue),transparent);opacity:.25}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;margin-bottom:16px;border-bottom:1px solid var(--glass-border)}
.brand-logo{width:40px;height:40px;border-radius:var(--radius-md);background:var(--grad-primary);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-glow-blue);flex-shrink:0}
.brand-logo svg{width:22px;height:22px}
.brand-title{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);color:var(--text-1);font-size:14px;font-weight:500;transition:all var(--t-fast) var(--ease-out);position:relative;overflow:hidden}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item span:not(.nav-badge){flex:1;text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--text-0);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(168,85,247,.12));color:var(--text-0);box-shadow:inset 0 0 0 1px rgba(79,140,255,.35)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--grad-primary);border-radius:0 3px 3px 0;box-shadow:var(--shadow-glow-blue)}
.nav-badge{background:var(--bg-3);color:var(--text-2);font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.nav-badge.neon{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-glow-blue)}
.sidebar-footer{margin-top:16px;padding-top:16px;border-top:1px solid var(--glass-border)}
.profile-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-md);background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid var(--glass-border);transition:all var(--t-fast) var(--ease-out)}
.profile-card:hover{border-color:var(--glass-border-strong);background:var(--bg-hover)}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;box-shadow:var(--shadow-glow-blue)}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-role{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-settings{color:var(--text-2);padding:6px;border-radius:6px;transition:all var(--t-fast) var(--ease-out)}
.profile-settings svg{width:16px;height:16px}
.profile-settings:hover{color:var(--text-0);background:var(--bg-3);transform:rotate(60deg)}

.main-content{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--topbar-h);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--glass-border);background:rgba(11,13,20,.7);backdrop-filter:blur(20px);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:16px;flex:1;max-width:540px}
.topbar-right{display:flex;align-items:center;gap:12px}
.search-box{flex:1;position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:14px;width:16px;height:16px;color:var(--text-2);pointer-events:none}
.search-box input{width:100%;padding:11px 14px 11px 42px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:13px;color:var(--text-0);transition:all var(--t-fast) var(--ease-out)}
.search-box input:focus{outline:none;border-color:var(--neon-blue);background:var(--bg-3);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.search-box input::placeholder{color:var(--text-3)}
.search-box kbd{position:absolute;right:12px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;background:var(--bg-3);border:1px solid var(--glass-border);border-radius:5px;color:var(--text-2)}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-2);border:1px solid var(--glass-border);color:var(--text-1);display:flex;align-items:center;justify-content:center;position:relative;transition:all var(--t-fast) var(--ease-out)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--bg-3);color:var(--text-0);border-color:var(--glass-border-strong);transform:translateY(-1px)}
.mobile-menu{display:none}
.notif-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--neon-pink);box-shadow:0 0 8px var(--neon-pink);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;transition:all var(--t-fast) var(--ease-out);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-glow-blue),var(--shadow-md)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow-purple),var(--shadow-lg)}
.btn-secondary{background:var(--bg-2);color:var(--text-0);border:1px solid var(--glass-border)}
.btn-secondary:hover{background:var(--bg-3);border-color:var(--glass-border-strong)}
.btn-ghost{color:var(--text-1);padding:8px 12px}
.btn-ghost:hover{color:var(--text-0);background:var(--bg-hover)}
.view-container{flex:1;overflow-y:auto;padding:32px;position:relative}
.view{animation:fadeInUp var(--t-med) var(--ease-out)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.view-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.view-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.view-subtitle{font-size:14px;color:var(--text-2)}
.view-actions{display:flex;gap:10px;align-items:center}

.card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:22px;transition:all var(--t-med) var(--ease-out);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glass-border-strong),transparent)}
.card:hover{border-color:var(--glass-border-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-subtitle{font-size:12px;color:var(--text-2)}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.metric-card{position:relative;overflow:hidden}
.metric-icon{width:42px;height:42px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.metric-icon svg{width:20px;height:20px;color:#fff}
.metric-icon.blue{background:var(--grad-primary);box-shadow:var(--shadow-glow-blue)}
.metric-icon.cyan{background:var(--grad-secondary);box-shadow:0 0 24px rgba(34,211,238,.3)}
.metric-icon.green{background:var(--grad-success);box-shadow:0 0 24px rgba(52,211,153,.3)}
.metric-icon.warm{background:var(--grad-warm);box-shadow:0 0 24px rgba(244,114,182,.3)}
.metric-label{font-size:12px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.metric-value{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px;font-variant-numeric:tabular-nums}
.metric-delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px}
.metric-delta.up{color:var(--neon-green);background:rgba(52,211,153,.12)}
.metric-delta.down{color:var(--neon-red);background:rgba(248,113,113,.12)}
.metric-spark{position:absolute;right:16px;bottom:16px;width:90px;height:38px;opacity:.7}

.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.chart-card{height:320px;display:flex;flex-direction:column}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.chart-body{flex:1;position:relative}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.activity-list{display:flex;flex-direction:column;gap:12px;max-height:260px;overflow-y:auto;padding-right:4px}
.activity-item{display:flex;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);transition:all var(--t-fast) var(--ease-out);border-left:2px solid transparent}
.activity-item:hover{background:var(--bg-hover);border-left-color:var(--neon-blue)}
.activity-icon{width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.activity-body{flex:1;min-width:0}
.activity-text{font-size:13px;color:var(--text-1);line-height:1.4}
.activity-text strong{color:var(--text-0);font-weight:600}
.activity-time{font-size:11px;color:var(--text-3);margin-top:2px}

.campaigns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.campaign-card{display:flex;flex-direction:column;gap:16px}
.campaign-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.campaign-name{font-size:16px;font-weight:600;margin-bottom:4px}
.campaign-desc{font-size:12px;color:var(--text-2);line-height:1.5}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.status-pill::before{content:'';width:6px;height:6px;border-radius:50%}
.status-pill.active{background:rgba(52,211,153,.12);color:var(--neon-green)}
.status-pill.active::before{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);animation:pulse 2s ease-in-out infinite}
.status-pill.paused{background:rgba(251,191,36,.12);color:var(--neon-amber)}
.status-pill.paused::before{background:var(--neon-amber)}
.status-pill.draft{background:rgba(138,145,166,.12);color:var(--text-2)}
.status-pill.draft::before{background:var(--text-2)}
.campaign-steps{display:flex;gap:8px;padding:12px;background:rgba(7,8,12,.5);border-radius:var(--radius-sm)}
.step-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:6px;background:var(--bg-2);font-size:10px;color:var(--text-2);text-align:center}
.step-chip svg{width:14px;height:14px}
.step-chip.done{color:var(--neon-green);background:rgba(52,211,153,.08)}
.step-chip.active{color:var(--neon-blue);background:rgba(79,140,255,.12);box-shadow:inset 0 0 0 1px var(--neon-blue)}
.campaign-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--glass-border)}
.stat-mini{text-align:center}
.stat-mini-val{font-size:17px;font-weight:700}
.stat-mini-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.campaign-progress{height:6px;background:var(--bg-3);border-radius:10px;overflow:hidden}
.campaign-progress-bar{height:100%;background:var(--grad-primary);border-radius:10px;box-shadow:0 0 12px rgba(79,140,255,.6);transition:width var(--t-slow) var(--ease-out)}

.inbox-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;height:calc(100vh - var(--topbar-h) - 64px - 90px);min-height:520px}
@media(max-width:1100px){.inbox-layout{grid-template-columns:1fr}}
.inbox-list{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.inbox-filters{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--glass-border);overflow-x:auto}
.filter-chip{padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-2);border-radius:20px;background:var(--bg-2);white-space:nowrap;transition:all var(--t-fast) var(--ease-out)}
.filter-chip:hover{color:var(--text-0)}
.filter-chip.active{color:#fff;background:var(--grad-primary);box-shadow:var(--shadow-glow-blue)}
.inbox-threads{flex:1;overflow-y:auto}
.thread-item{display:flex;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--glass-border);transition:all var(--t-fast) var(--ease-out);position:relative;width:100%;text-align:left}
.thread-item:hover{background:var(--bg-hover)}
.thread-item.active{background:rgba(79,140,255,.08)}
.thread-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-primary)}
.thread-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;border:1px solid var(--glass-border)}
.thread-body{flex:1;min-width:0}
.thread-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.thread-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-time{font-size:11px;color:var(--text-3);flex-shrink:0;margin-left:8px}
.thread-preview{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.thread-item.unread .thread-name{color:var(--neon-blue)}
.thread-item.unread .thread-preview{color:var(--text-1);font-weight:500}
.inbox-detail{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden}
.detail-header{padding:18px 22px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;gap:14px}
.detail-user{display:flex;gap:12px;align-items:center}
.detail-name{font-size:15px;font-weight:600}
.detail-title{font-size:12px;color:var(--text-2);margin-top:2px}
.detail-messages{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.msg-bubble{max-width:75%;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;line-height:1.5}
.msg-bubble.incoming{background:var(--bg-3);color:var(--text-1);border-bottom-left-radius:4px}
.msg-bubble.outgoing{background:var(--grad-primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:var(--shadow-glow-blue)}
.msg-time{font-size:10px;color:var(--text-3);margin-top:4px}
.detail-compose{padding:16px 22px;border-top:1px solid var(--glass-border);display:flex;gap:10px;align-items:flex-end}
.compose-input{flex:1;min-height:44px;max-height:140px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:13px;resize:none;transition:all var(--t-fast) var(--ease-out)}
.compose-input:focus{outline:none;border-color:var(--neon-blue);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.quick-templates{display:flex;gap:6px;padding:0 22px 14px;flex-wrap:wrap}
.template-chip{padding:5px 10px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:20px;font-size:11px;color:var(--text-2);transition:all var(--t-fast) var(--ease-out)}
.template-chip:hover{color:var(--neon-cyan);border-color:var(--neon-cyan)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:16px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(260px,1fr))}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;min-height:400px}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--glass-border);margin-bottom:12px}
.col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.col-title .dot{width:8px;height:8px;border-radius:50%}
.col-new .dot{background:var(--neon-blue);box-shadow:0 0 8px var(--neon-blue)}
.col-contacted .dot{background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.col-engaged .dot{background:var(--neon-purple);box-shadow:0 0 8px var(--neon-purple)}
.col-won .dot{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.col-count{font-size:11px;color:var(--text-2);padding:2px 8px;background:var(--bg-3);border-radius:10px}
.kanban-cards{display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.lead-card{padding:14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);cursor:grab;transition:all var(--t-fast) var(--ease-out)}
.lead-card:hover{border-color:var(--glass-border-strong);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.lead-card:active{cursor:grabbing}
.lead-head{display:flex;gap:10px;margin-bottom:10px}
.lead-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad-secondary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0}
.lead-name{font-size:13px;font-weight:600}
.lead-company{font-size:11px;color:var(--text-2);margin-top:1px}
.lead-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:2px 7px;font-size:10px;border-radius:4px;font-weight:500}
.tag.hr{background:rgba(168,85,247,.15);color:var(--neon-purple)}
.tag.ceo{background:rgba(79,140,255,.15);color:var(--neon-blue)}
.tag.latam{background:rgba(34,211,238,.15);color:var(--neon-cyan)}
.tag.wellness{background:rgba(52,211,153,.15);color:var(--neon-green)}
.lead-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-3)}
.lead-score{display:flex;align-items:center;gap:4px}
.lead-score .heat{color:var(--neon-amber)}

.content-layout{display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:1100px){.content-layout{grid-template-columns:1fr}}
.calendar{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:22px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.calendar-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.calendar-nav{display:flex;gap:6px}
.cal-btn{width:32px;height:32px;border-radius:8px;background:var(--bg-2);border:1px solid var(--glass-border);color:var(--text-1);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast) var(--ease-out)}
.cal-btn:hover{background:var(--bg-3);color:var(--text-0)}
.cal-btn svg{width:14px;height:14px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:8px 0}
.cal-day{aspect-ratio:1;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;padding:6px;font-size:11px;color:var(--text-2);position:relative;cursor:pointer;transition:all var(--t-fast) var(--ease-out);display:flex;flex-direction:column;min-height:62px}
.cal-day:hover{border-color:var(--neon-blue);background:var(--bg-3)}
.cal-day.today{background:rgba(79,140,255,.08);border-color:var(--neon-blue);color:var(--text-0);font-weight:600}
.cal-day.out{opacity:.3}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--neon-purple);box-shadow:0 0 6px var(--neon-purple);margin-top:auto;align-self:flex-start}
.cal-dot.blue{background:var(--neon-blue);box-shadow:0 0 6px var(--neon-blue)}
.cal-dot.cyan{background:var(--neon-cyan);box-shadow:0 0 6px var(--neon-cyan)}
.posts-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.post-item{padding:14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);transition:all var(--t-fast) var(--ease-out)}
.post-item:hover{border-color:var(--glass-border-strong);transform:translateX(2px)}
.post-date{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--neon-cyan);font-weight:600;margin-bottom:6px}
.post-text{font-size:12px;color:var(--text-1);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-foot{display:flex;justify-content:space-between;align-items:center}
.post-type{font-size:10px;padding:2px 7px;background:rgba(168,85,247,.12);color:var(--neon-purple);border-radius:4px}
.post-actions{display:flex;gap:4px}
.post-actions button{width:24px;height:24px;border-radius:5px;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.post-actions button:hover{background:var(--bg-3);color:var(--text-0)}
.post-actions svg{width:12px;height:12px}

.empty{text-align:center;padding:60px 20px;color:var(--text-2);font-size:13px}

.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:1000;pointer-events:none}
.toast{pointer-events:auto;min-width:280px;padding:14px 18px;background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border-strong);border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);animation:slideInRight var(--t-med) var(--ease-out);font-size:13px}
.toast.success{border-left:3px solid var(--neon-green)}
.toast.info{border-left:3px solid var(--neon-blue)}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

/* ── Skills ────────────────────────────────────────────────────────── */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:28px}
.skill-card{display:flex;flex-direction:column;gap:14px}
.skill-head{display:flex;align-items:center;gap:14px}
.skill-badge{width:46px;height:46px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.skill-name{font-size:15px;font-weight:600;margin-bottom:3px}
.skill-cat{font-size:11px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.skill-bar-wrap{height:6px;background:var(--bg-3);border-radius:10px;overflow:hidden}
.skill-bar{height:100%;border-radius:10px;box-shadow:0 0 10px currentColor;transition:width .6s var(--ease-out)}
.skill-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:12px;border-top:1px solid var(--glass-border)}
.skill-stat{text-align:center;font-size:11px;color:var(--text-2)}
.skill-stat strong{display:block;font-size:16px;font-weight:700;color:var(--text-0);margin-bottom:2px}
.skill-actions{display:flex;gap:8px}
.endorse-queue{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:22px}
.queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.queue-list{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto}
.queue-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);transition:all var(--t-fast) var(--ease-out)}
.queue-item:hover{border-color:var(--glass-border-strong)}
.queue-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.queue-info{flex:1;min-width:0}
.queue-name{font-size:13px;font-weight:600}
.queue-skill{font-size:11px;color:var(--neon-cyan);margin-top:1px}
.queue-status{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600}
.queue-status.pending{background:rgba(251,191,36,.12);color:var(--neon-amber)}
.queue-status.done{background:rgba(52,211,153,.12);color:var(--neon-green)}

/* ── Connectors ─────────────────────────────────────────────────────── */
.connectors-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-bottom:28px}
.connector-card{display:flex;flex-direction:column;gap:16px;transition:all var(--t-med) var(--ease-out)}
.connector-card.connected{border-color:rgba(52,211,153,.35);box-shadow:0 0 0 1px rgba(52,211,153,.2)}
.connector-head{display:flex;align-items:center;gap:14px}
.connector-logo{width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--glass-border)}
.connector-name{font-size:15px;font-weight:700;margin-bottom:3px}
.connector-desc{font-size:12px;color:var(--text-2);line-height:1.45}
.connector-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-2);border-radius:var(--radius-sm);border:1px solid var(--glass-border)}
.toggle-label{font-size:12px;font-weight:600;color:var(--text-1)}
.toggle-switch{position:relative;width:42px;height:24px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg-3);border-radius:24px;transition:background var(--t-fast)}
.toggle-thumb{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform var(--t-fast) var(--ease-out);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle-switch input:checked + .toggle-track{background:var(--neon-green)}
.toggle-switch input:checked ~ .toggle-thumb{transform:translateX(18px)}
.connector-field{display:flex;flex-direction:column;gap:6px}
.connector-field label{font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.connector-input{width:100%;padding:9px 12px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-0);transition:all var(--t-fast)}
.connector-input:focus{outline:none;border-color:var(--neon-blue);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.connector-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--glass-border)}
.conn-stat{text-align:center;flex:1}
.conn-stat-val{font-size:18px;font-weight:700;color:var(--text-0)}
.conn-stat-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.webhook-banner{background:linear-gradient(135deg,rgba(79,140,255,.1),rgba(168,85,247,.1));border:1px solid rgba(79,140,255,.25);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.webhook-icon{width:44px;height:44px;border-radius:var(--radius-md);background:var(--grad-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.webhook-icon svg{width:22px;height:22px;color:#fff}
.webhook-url{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--neon-cyan);background:var(--bg-2);padding:8px 12px;border-radius:6px;border:1px solid var(--glass-border);margin-top:6px;word-break:break-all}

@media(max-width:960px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:100;transform:translateX(-100%);transition:transform var(--t-med) var(--ease-out);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:flex}
  .topbar{padding:0 20px}
  .view-container{padding:20px}
  .search-box kbd{display:none}
}
@media(max-width:640px){
  .btn{font-size:12px;padding:10px 14px}
  .view-title{font-size:22px}
}

/* ── Auth / Login ──────────────────────────────────────────────────────────── */
.auth-page{position:fixed;inset:0;background:var(--bg-0);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.auth-page::before{content:'';position:fixed;inset:0;background:var(--grad-glow);pointer-events:none}
.auth-card{position:relative;width:100%;max-width:420px;background:var(--glass-bg);backdrop-filter:blur(24px);border:1px solid var(--glass-border-strong);border-radius:24px;padding:40px;box-shadow:0 32px 64px rgba(0,0,0,.6),var(--shadow-glow-blue)}
.auth-logo{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--grad-primary);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:var(--shadow-glow-blue)}
.auth-logo svg{width:28px;height:28px;color:#fff}
.auth-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.auth-sub{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:32px}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.auth-field label{font-size:12px;font-weight:600;color:var(--text-1);letter-spacing:.04em}
.auth-input{width:100%;padding:13px 16px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:14px;color:var(--text-0);transition:all var(--t-fast)}
.auth-input:focus{outline:none;border-color:var(--neon-blue);background:var(--bg-3);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.auth-input::placeholder{color:var(--text-3)}
.auth-error{font-size:12px;color:var(--neon-red);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;display:none}
.auth-error.show{display:block}
.auth-btn{width:100%;padding:14px;background:var(--grad-primary);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:700;letter-spacing:.01em;box-shadow:var(--shadow-glow-blue),var(--shadow-md);transition:all var(--t-fast);margin-top:4px}
.auth-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow-purple),var(--shadow-lg)}
.auth-btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
.auth-version{text-align:center;font-size:11px;color:var(--text-3);margin-top:20px}

/* ── Admin Panel ───────────────────────────────────────────────────────────── */
.admin-grid{display:grid;grid-template-columns:1fr 380px;gap:18px}
@media(max-width:1100px){.admin-grid{grid-template-columns:1fr}}
.users-table{width:100%;border-collapse:collapse}
.users-table th{font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--glass-border)}
.users-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.users-table tr:hover td{background:var(--bg-hover)}
.role-badge{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.role-badge.admin{background:rgba(168,85,247,.18);color:var(--neon-purple)}
.role-badge.user{background:rgba(79,140,255,.15);color:var(--neon-blue)}
.new-user-form{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:24px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-row label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.form-input{padding:10px 13px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-0);transition:all var(--t-fast)}
.form-input:focus{outline:none;border-color:var(--neon-blue);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.form-select{padding:10px 13px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-0)}

/* ── Logout / User chip in topbar ─────────────────────────────────────────── */
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);cursor:default}
.user-chip-avatar{width:28px;height:28px;border-radius:50%;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.user-chip-name{font-size:12px;font-weight:600;color:var(--text-0)}
.user-chip-role{font-size:10px;color:var(--text-2)}
.logout-btn{width:34px;height:34px;border-radius:var(--radius-sm);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:var(--neon-red);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.logout-btn:hover{background:rgba(248,113,113,.2);transform:translateY(-1px)}
.logout-btn svg{width:15px;height:15px}
</style>
</head>
<body>

      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 10v6M8 7.5v.01M12 16v-4M12 16c0-2 1-4 3-4s1 2 1 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

      <button class="nav-item" data-view="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>Habilidades</span><span class="nav-badge">248</span></button>
      <button class="nav-item" data-view="connectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg><span>Conectores</span><span class="nav-badge neon">4</span></button>
      <button class="nav-item" data-view="automations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Automatizaciones</span><span class="nav-badge">4</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="profile-card" id="sidebarProfileCard">
        <div class="profile-avatar" id="sidebarAvatar">SL</div>
        <div class="profile-info">
          <div class="profile-name" id="sidebarName">Sebastián Levin</div>
          <div class="profile-role" id="sidebarRole">Founder · Care Assistance</div>
        </div>
        <button class="profile-settings logout-btn" title="Cerrar sesión" onclick="AUTH.logout()" style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:var(--neon-red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu" id="mobileMenuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Buscar leads, campañas, mensajes..." />
          <kbd>Ctrl K</kbd>

      </div>
      <div class="topbar-right">

// AUTH SYSTEM
// ============================================
const AUTH = (() => {
  const SALT = 'lm-salt-2026-sebalev';
  const STORE_KEY = 'lm_users_v2';
  const SESSION_KEY = 'lm_session_v2';

  async function hashPwd(pwd) {
    const data = new TextEncoder().encode(pwd + SALT);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function getUsers() { return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }
  function saveUsers(u) { localStorage.setItem(STORE_KEY, JSON.stringify(u)); }
  function getSession() { return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }
  function saveSession(u) { sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)); }

  async function init() {
    let users = getUsers();
    if (!users.length) {
      const hash = await hashPwd('Admin2026!');
      users = [{ id:'admin-1', name:'Sebastián Levin', username:'sebastian', role:'admin', passwordHash:hash, company:'Care Assistance', createdAt:new Date().toISOString() }];
      saveUsers(users);
    }
  }

  async function login(username, password) {
    const users = getUsers();
    const user = users.find(u => u.username === username.toLowerCase().trim());
    if (!user) return { ok:false, error:'Usuario no encontrado' };
    const hash = await hashPwd(password);
    if (hash !== user.passwordHash) return { ok:false, error:'Contraseña incorrecta' };
    saveSession(user);
    return { ok:true, user };
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  }

  function current() { return getSession(); }
  function isAdmin() { const s = getSession(); return s && s.role === 'admin'; }

  async function createUser(name, username, password, role, company) {
    const users = getUsers();
    if (users.find(u => u.username === username.toLowerCase())) return { ok:false, error:'El usuario ya existe' };
    const hash = await hashPwd(password);
    const user = { id:'u-'+Date.now(), name, username:username.toLowerCase(), role, passwordHash:hash, company, createdAt:new Date().toISOString() };
    users.push(user);
    saveUsers(users);
    return { ok:true, user };
  }

  function deleteUser(id) {
    const users = getUsers().filter(u => u.id !== id);
    saveUsers(users);
  }

  function allUsers() { return getUsers(); }

  async function showLogin() {
    await init();
    document.body.innerHTML = `
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 10v6M8 7.5v.01M12 16v-4M12 16c0-2 1-4 3-4s1 2 1 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="auth-title">LinkedIn Manager</div>
        <div class="auth-sub">Founder Edition · Iniciá sesión para continuar</div>
        <div class="auth-error" id="authError"></div>
        <div class="auth-field"><label>Usuario</label><input class="auth-input" id="authUser" type="text" placeholder="tu usuario" autocomplete="username"/></div>
        <div class="auth-field"><label>Contraseña</label><input class="auth-input" id="authPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
        <button class="auth-btn" id="authBtn">Ingresar</button>
        <div class="auth-version">LinkedIn Manager v2.0 · Acceso restringido</div>
      </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>`;

    const doLogin = async () => {
      const btn = document.getElementById('authBtn');
      const err = document.getElementById('authError');
      const u = document.getElementById('authUser').value;
      const p = document.getElementById('authPass').value;
      if (!u || !p) { err.textContent='Completá usuario y contraseña'; err.classList.add('show'); return; }
      btn.disabled = true; btn.textContent = 'Verificando...';
      const res = await login(u, p);
      if (res.ok) {
        btn.textContent = '✓ Ingresando...';
        setTimeout(() => location.reload(), 400);
      } else {
        err.textContent = res.error; err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    };
    document.getElementById('authBtn').addEventListener('click', doLogin);
    document.getElementById('authPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    document.getElementById('authUser').focus();
  }

  return { init, login, logout, current, isAdmin, createUser, deleteUser, allUsers, showLogin };
})();

function spark(values, color) {
  const w=90,h=38,pad=2,max=Math.max(...values),min=Math.min(...values),range=max-min||1,step=(w-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>`${pad+i*step},${h-pad-((v-min)/range)*(h-pad*2)}`).join(' ');
  const id = color.slice(1);
  return `<svg class="metric-spark" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.4"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" points="${pts}"/><polygon fill="url(#g-${id})" points="${pts} ${w-pad},${h-pad} ${pad},${h-pad}"/></svg>`;
}
function lineChart(data) {
  const w=640,h=220,pad={top:20,right:20,bottom:30,left:36},plotW=w-pad.left-pad.right,plotH=h-pad.top-pad.bottom;
  const series=[{values:data.connections,color:'#4f8cff'},{values:data.messages,color:'#a855f7'},{values:data.views,color:'#22d3ee'}];
  const allVals=series.flatMap(s=>s.values),max=Math.max(...allVals)*1.15,step=plotW/(data.labels.length-1);
  let grid='';
  for(let i=0;i<=4;i++){const y=pad.top+(plotH/4)*i;const v=Math.round(max-(max/4)*i);grid+=`<line x1="${pad.left}" y1="${y}" x2="${w-pad.right}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2,4"/><text x="${pad.left-8}" y="${y+4}" text-anchor="end" fill="#565d73" font-size="10" font-family="Inter">${v}</text>`;}
  let xlabels='';data.labels.forEach((lbl,i)=>{const x=pad.left+i*step;xlabels+=`<text x="${x}" y="${h-8}" text-anchor="middle" fill="#8a91a6" font-size="11" font-family="Inter" font-weight="500">${lbl}</text>`;});
  let paths='';series.forEach((s,idx)=>{const pts=s.values.map((v,i)=>({x:pad.left+i*step,y:pad.top+plotH-(v/max)*plotH}));const d=pts.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');const area=`${d} L${pts[pts.length-1].x},${pad.top+plotH} L${pts[0].x},${pad.top+plotH} Z`;paths+=`<path d="${area}" fill="url(#area-${idx})" opacity="0.25"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;pts.forEach(p=>{paths+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${s.color}" stroke="#11141e" stroke-width="1.5"/>`;});});
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;"><defs><linearGradient id="area-0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#4f8cff"/><stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/></linearGradient><linearGradient id="area-1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="area-2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>${grid}${paths}${xlabels}</svg>`;
}

let _modalCurrentStep = 0;

function openCampaignModal() {
  _modalCurrentStep = 0;
  const modal = document.getElementById('campaignModal');
  modal.style.display = 'flex';
  updateModalStep();
  // Load accounts into selector
  fetch(LI_API + '/accounts').then(r=>r.json()).then(accounts=>{
    const sel = document.getElementById('c-account');
    if (!sel) return;
    if (!Array.isArray(accounts)||!accounts.length) {
      sel.innerHTML = '<option value="">— Sin cuentas. Ir a Conectores primero —</option>';
    } else {
      sel.innerHTML = accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
    }
  }).catch(()=>{ const sel=document.getElementById('c-account'); if(sel) sel.innerHTML='<option value="">— Cuenta demo —</option>'; });
}

function closeCampaignModal() {
  const modal = document.getElementById('campaignModal');
  if (modal) modal.style.display = 'none';
}

function updateModalStep() {
  [0,1,2,3].forEach(i => {
    const sec = document.getElementById('ms-'+i);
    if (sec) sec.style.display = i===_modalCurrentStep ? 'block' : 'none';
    const dot = document.getElementById('mdot-'+i);
    const lbl = document.getElementById('mlbl-'+i);
    if (dot) {
      dot.style.background = i < _modalCurrentStep ? 'var(--neon-green)' : i===_modalCurrentStep ? 'var(--neon-blue)' : 'var(--bg-3)';
      dot.style.color = i <= _modalCurrentStep ? '#fff' : 'var(--text-2)';
    }
    if (lbl) lbl.style.color = i===_modalCurrentStep ? 'var(--text-0)' : 'var(--text-3)';
  });
  const back = document.getElementById('modalBackBtn');
  const next = document.getElementById('modalNextBtn');
  const launch = document.getElementById('modalLaunchBtn');
  if (back) back.style.display = _modalCurrentStep > 0 ? 'inline-flex' : 'none';
  if (next) next.style.display = _modalCurrentStep < 3 ? 'inline-flex' : 'none';
  if (launch) launch.style.display = _modalCurrentStep === 3 ? 'inline-flex' : 'none';
  if (_modalCurrentStep === 3) buildSummary();
}

function modalStep(dir) {
  if (dir > 0 && _modalCurrentStep === 0) {
    const name = document.getElementById('c-name')?.value.trim();
    if (!name) { const m=document.getElementById('modalMsg'); if(m){m.style.color='var(--neon-red)';m.textContent='El nombre de la campaña es obligatorio';} return; }
  }
  const msg = document.getElementById('modalMsg');
  if (msg) msg.textContent = '';
  _modalCurrentStep = Math.max(0, Math.min(3, _modalCurrentStep + dir));
  updateModalStep();
}

function buildSummary() {
  const name  = document.getElementById('c-name')?.value||'—';
  const type  = document.getElementById('c-type')?.options[document.getElementById('c-type').selectedIndex]?.text||'—';
  const urls  = (document.getElementById('c-urls')?.value||'').split('\n').filter(u=>u.trim()).length;
  const limit = document.getElementById('c-limit')?.value||20;
  const sum = document.getElementById('c-summary');
  if (sum) sum.innerHTML = `
    <div>📌 <strong>Nombre:</strong> ${name}</div>
    <div>🎯 <strong>Tipo:</strong> ${type}</div>
    <div>👥 <strong>Perfiles objetivo:</strong> ${urls} URLs cargadas</div>
    <div>⏱ <strong>Límite diario:</strong> ${limit} acciones/día</div>
    <div>📊 <strong>Estado inicial:</strong> Borrador</div>`;
}

async function launchCampaign() {
  const name    = document.getElementById('c-name')?.value.trim();
  const desc    = document.getElementById('c-desc')?.value.trim();
  const type    = document.getElementById('c-type')?.value||'connection';
  const accId   = document.getElementById('c-account')?.value;
  const urlsRaw = document.getElementById('c-urls')?.value||'';
  const limit   = parseInt(document.getElementById('c-limit')?.value)||20;
  const note    = document.getElementById('c-note')?.value.trim();
  const msg1    = document.getElementById('c-msg1')?.value.trim();
  const msg2    = document.getElementById('c-msg2')?.value.trim();
  const urls    = urlsRaw.split('\n').map(u=>u.trim()).filter(Boolean);

  const btn = document.getElementById('modalLaunchBtn');
  const msg = document.getElementById('modalMsg');
  if (btn) { btn.disabled=true; btn.textContent='Creando...'; }
  if (msg) { msg.textContent=''; }

  try {
    const r = await fetch(LI_API + '/automations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type,
        name,
        description: desc,
        targets: { profileUrls: urls },
        content: { connectionNote: note, template: msg1, followUp: msg2 },
        schedule: { dailyLimit: limit },
        accountId: accId,
      })
    });
    const d = await r.json();
    if (d.id || d.ok !== false) {
      // Also save locally for display
      DATA.campaigns.push({
        id: d.id || ('c-'+Date.now()),
        name, description: desc,
        status: 'draft', progress: 0,
        stats: { sent:0, accepted:0, replies:0 },
        steps: [
          {label:'Visita perfil',state:'pending'},
          {label:'Conexión',state:'pending'},
          {label:'Mensaje 1',state:'pending'},
          {label:'Follow-up',state:'pending'}
        ]
      });
      closeCampaignModal();
      toast('Campaña "' + name + '" creada exitosamente 🚀', 'success', 4000);
      loadCampaigns();
    } else {
      if (msg) { msg.style.color='var(--neon-red)'; msg.textContent='Error: '+(d.error||'No se pudo crear'); }
    }
  } catch (err) {
    // Offline mode — save only locally
    DATA.campaigns.push({
      id: 'c-'+Date.now(), name, description: desc,
      status: 'draft', progress: 0,
      stats: { sent:0, accepted:0, replies:0 },
      steps: [
        {label:'Visita perfil',state:'pending'},{label:'Conexión',state:'pending'},
        {label:'Mensaje 1',state:'pending'},{label:'Follow-up',state:'pending'}
      ]
    });
    closeCampaignModal();
    toast('Campaña creada (modo local — backend no disponible)', 'info', 4000);
    loadCampaigns();
  } finally {
    if (btn) { btn.disabled=false; btn.textContent='🚀 Crear campaña'; }
  }
}

async function loadCampaigns() {
  const grid = document.getElementById('campaignsGrid');
  if (!grid) return;
  // Try backend first
  try {
    const r = await fetch(LI_API + '/automations', { signal: AbortSignal.timeout(3000) });
    const items = await r.json();
    if (Array.isArray(items) && items.length) {
      const mapped = items.map(a => ({
        id: a.id, name: a.name, description: a.triggerLabel || '',
        status: a.status, progress: Math.round((a.stats?.actionsToday||0)/Math.max(a.schedule?.dailyLimit||20,1)*100),
        stats: { sent: a.stats?.total||0, accepted: 0, replies: 0 },
        steps: [{label:'Visita perfil',state:'done'},{label:'Conexión',state:a.status==='active'?'active':'pending'},{label:'Mensaje 1',state:'pending'},{label:'Follow-up',state:'pending'}]
      }));
      // Merge with local
      const allIds = new Set(mapped.map(m=>m.id));
      const extra = DATA.campaigns.filter(c=>!allIds.has(c.id));
      renderCampaignGrid([...mapped,...extra], grid);
      return;
    }
  } catch {}
  // Show local data
  renderCampaignGrid(DATA.campaigns, grid);
}

function renderCampaignGrid(campaigns, grid) {
  if (!campaigns.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">🚀</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px">Todavía no tenés campañas</div>
      <div style="font-size:14px;color:var(--text-2);margin-bottom:24px">Creá tu primera campaña de outreach y empezá a conectar con tu audiencia</div>
      <button class="btn btn-primary" onclick="document.getElementById('newCampaignFormBtn').click()">✨ Crear mi primera campaña</button>
    </div>`;
    return;
  }
  grid.innerHTML = campaigns.map(campaignCard).join('');
  grid.addEventListener('click',(e)=>{
    const btn=e.target.closest('[data-action]'); if(!btn)return;
    const id=btn.dataset.id;
    if(btn.dataset.action==='toggle'){
      const c=DATA.campaigns.find(x=>x.id===id)||{};
      if(c.status){c.status=c.status==='active'?'paused':c.status==='paused'?'active':'active';}
      toast('Estado actualizado','success'); loadCampaigns();
    } else if(btn.dataset.action==='delete'){
      if(confirm('¿Eliminar esta campaña?')){
        DATA.campaigns=DATA.campaigns.filter(c=>c.id!==id);
        fetch(LI_API+'/automations/'+id,{method:'DELETE'}).catch(()=>{});
        toast('Campaña eliminada','info'); loadCampaigns();
      }
    }
  });
}

    <div class="view-header"><div><h1 class="view-title">Leads CRM</h1><p class="view-subtitle">Pipeline visual de prospectos B2B · Arrastrá para mover</p></div><div class="view-actions"><button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir lead</button></div></div>
    <div class="kanban" id="kanban">${kanbanCols.map(c=>`<div class="kanban-col ${c.cls}" data-col="${c.key}"><div class="kanban-col-header"><div class="col-title"><span class="dot"></span>${c.title}</div><div class="col-count">${DATA.leads[c.key].length}</div></div><div class="kanban-cards">${DATA.leads[c.key].map(leadCard).join('')}</div></div>`).join('')}</div>
  </div>`;
  const kanban=container.querySelector('#kanban');
  let draggingId=null,sourceCol=null;
  kanban.addEventListener('dragstart',(e)=>{const c=e.target.closest('.lead-card');if(!c)return;draggingId=c.dataset.id;sourceCol=c.closest('.kanban-col').dataset.col;c.style.opacity='0.4';});
  kanban.addEventListener('dragend',(e)=>{const c=e.target.closest('.lead-card');if(c)c.style.opacity='';});
  kanban.addEventListener('dragover',(e)=>{const col=e.target.closest('.kanban-col');if(!col)return;e.preventDefault();col.style.background='rgba(79,140,255,0.08)';});
  kanban.addEventListener('dragleave',(e)=>{const col=e.target.closest('.kanban-col');if(col)col.style.background='';});
  kanban.addEventListener('drop',(e)=>{const col=e.target.closest('.kanban-col');if(!col||!draggingId)return;e.preventDefault();col.style.background='';const to=col.dataset.col;if(to===sourceCol)return;const lead=DATA.leads[sourceCol].find(l=>l.id===draggingId);if(lead){DATA.leads[sourceCol]=DATA.leads[sourceCol].filter(l=>l.id!==draggingId);DATA.leads[to].push(lead);}renderLeads(container);toast(`Lead movido a ${kanbanCols.find(c=>c.key===to).title}`,'success');draggingId=null;sourceCol=null;});
}

let _schedEnabled = false;
function toggleSchedule() {
  _schedEnabled = !_schedEnabled;
  const track = document.getElementById('schedTrack');
  const thumb = document.getElementById('schedThumb');
  const lbl   = document.getElementById('schedToggleLbl');
  const fields = document.getElementById('schedFields');
  const btn   = document.getElementById('post-publish-btn');
  if (track)  track.style.background  = _schedEnabled ? 'var(--neon-blue)' : 'var(--bg-3)';
  if (thumb)  thumb.style.transform   = _schedEnabled ? 'translateX(16px)' : 'none';
  if (lbl)    lbl.textContent          = _schedEnabled ? 'Programado' : 'Publicar ahora';
  if (fields) fields.style.display    = _schedEnabled ? 'grid' : 'none';
  if (btn)    btn.textContent          = _schedEnabled ? '📅 Programar post' : '🚀 Publicar ahora en LinkedIn';
}

async function openPostModal() {
  _schedEnabled = false;
  const modal = document.getElementById('postModal');
  modal.style.display = 'flex';
  document.getElementById('post-modal-msg').textContent = '';
  document.getElementById('post-account-id').value = '';
  // Reset toggle
  const track = document.getElementById('schedTrack');
  const thumb = document.getElementById('schedThumb');
  const lbl   = document.getElementById('schedToggleLbl');
  const fields = document.getElementById('schedFields');
  const btn   = document.getElementById('post-publish-btn');
  if (track)  track.style.background  = 'var(--bg-3)';
  if (thumb)  thumb.style.transform   = 'none';
  if (lbl)    lbl.textContent          = 'Publicar ahora';
  if (fields) fields.style.display    = 'none';
  if (btn)    btn.textContent          = '🚀 Publicar ahora en LinkedIn';

  // Load accounts
  const listEl = document.getElementById('post-accounts-list');
  try {
    const r = await fetch(LI_API + '/accounts');
    const accounts = await r.json();
    if (Array.isArray(accounts) && accounts.length) {
      listEl.innerHTML = accounts.map(a => `
        <div onclick="selectPostAccount('${a.id}','${a.name}')" id="pac-${a.id}" style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-2);border:2px solid var(--glass-border);border-radius:10px;cursor:pointer;transition:all .15s">
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0077b5,#00a0dc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${a.initials||a.name?.slice(0,2)||'LI'}</div>
          <div><div style="font-size:13px;font-weight:600">${a.name||'Tu cuenta LinkedIn'}</div><div style="font-size:11px;color:#10b981">● Activa · ${a.stats?.actionsToday||0} acciones hoy</div></div>
          <div style="margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--glass-border)" id="pac-dot-${a.id}"></div>
        </div>`).join('');
      // Auto-select first
      selectPostAccount(accounts[0].id, accounts[0].name);
    } else {
      listEl.innerHTML = `<div style="padding:12px;background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.2);border-radius:8px;font-size:12px;color:var(--neon-amber)">⚠️ Sin cuentas conectadas — ir a <strong>Conectores</strong> y pegar tu cookie li_at</div>`;
    }
  } catch {
    listEl.innerHTML = `<div style="font-size:12px;color:var(--neon-amber)">⚠️ Backend no disponible — iniciá node server.js</div>`;
  }
}

function selectPostAccount(id, name) {
  document.getElementById('post-account-id').value = id;
  // Highlight selection
  document.querySelectorAll('[id^="pac-"]').forEach(el => {
    if (el.id === 'pac-'+id) {
      el.style.borderColor = 'var(--neon-blue)';
      el.style.background  = 'rgba(79,140,255,0.07)';
    } else if (!el.id.startsWith('pac-dot-')) {
      el.style.borderColor = 'var(--glass-border)';
      el.style.background  = 'var(--bg-2)';
    }
  });
  const dot = document.getElementById('pac-dot-'+id);
  if (dot) { dot.style.background = 'var(--neon-blue)'; dot.style.borderColor = 'var(--neon-blue)'; }
}

async function publishPostNow() {
  const accountId = document.getElementById('post-account-id')?.value;
  const text = document.getElementById('post-content-txt')?.value.trim();
  const btn = document.getElementById('post-publish-btn');
  const msg = document.getElementById('post-modal-msg');

  if (!accountId) { msg.style.color='var(--neon-red)'; msg.textContent='Seleccioná una cuenta de LinkedIn'; return; }
  if (!text || text.length < 10) { msg.style.color='var(--neon-red)'; msg.textContent='El post necesita al menos 10 caracteres'; return; }
  if (text.length > 3000) { msg.style.color='var(--neon-red)'; msg.textContent='Máx 3000 caracteres'; return; }

  // Scheduled mode — save locally
  if (_schedEnabled) {
    const date = document.getElementById('post-date')?.value;
    const time = document.getElementById('post-time')?.value;
    const label = new Date(date + 'T' + time).toLocaleString('es-AR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    DATA.scheduledPosts.unshift({ id:'p-'+Date.now(), date:'📅 ' + label, type:'Programado', text, scheduled:true });
    document.getElementById('postModal').style.display = 'none';
    document.getElementById('post-content-txt').value = '';
    toast('Post programado para ' + label, 'success', 5000);
    loadContentPosts();
    return;
  }

  // Publish now
  btn.disabled = true;
  btn.textContent = 'Publicando en LinkedIn... (30-60 seg)';
  msg.textContent = '';

  try {
    const r = await fetch(LI_API + '/automations/run-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accountId, action: 'publishPost', text })
    });
    const d = await r.json();
    if (d.ok) {
      DATA.scheduledPosts.unshift({ id:'p-'+Date.now(), date:'Publicado · ' + new Date().toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}), type:'Post directo', text });
      document.getElementById('postModal').style.display = 'none';
      document.getElementById('post-content-txt').value = '';
      toast('✅ Post publicado en LinkedIn', 'success', 5000);
      loadContentPosts();
    } else {
      msg.style.color = 'var(--neon-red)';
      msg.textContent = '❌ ' + (d.error || 'Error al publicar');
    }
  } catch(err) {
    msg.style.color = 'var(--neon-red)';
    msg.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Publicar ahora en LinkedIn';
  }
}

function savePostLocal() {
  const text = document.getElementById('post-content-txt')?.value.trim();
  if (!text || text.length < 5) { const m=document.getElementById('post-modal-msg'); if(m){m.style.color='var(--neon-red)';m.textContent='Escribí algo primero';} return; }
  DATA.scheduledPosts.unshift({ id:'p-'+Date.now(), date:'Borrador · ' + new Date().toLocaleDateString('es-AR'), type:'Borrador', text });
  document.getElementById('postModal').style.display = 'none';
  document.getElementById('post-content-txt').value = '';
  toast('Borrador guardado', 'info');
  loadContentPosts();
}

  const text = document.getElementById('post-content-txt')?.value.trim();
  const btn = document.getElementById('post-publish-btn');
  const msg = document.getElementById('post-modal-msg');

  if (!accountId) { msg.style.color='var(--neon-red)'; msg.textContent='Primero conectá una cuenta en Conectores'; return; }
  if (!text || text.length < 10) { msg.style.color='var(--neon-red)'; msg.textContent='El post necesita al menos 10 caracteres'; return; }
  if (text.length > 3000) { msg.style.color='var(--neon-red)'; msg.textContent='Máx 3000 caracteres'; return; }

  btn.disabled = true;
  btn.textContent = 'Publicando en LinkedIn... (puede tardar 30-60 seg)';
  msg.textContent = '';

  try {
    const r = await fetch(LI_API + '/automations/run-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accountId, action: 'publishPost', text })
    });
    const d = await r.json();
    if (d.ok) {
      // Save locally
      DATA.scheduledPosts.unshift({ id:'p-'+Date.now(), date:'Publicado ahora', type:'Post directo', text });
      document.getElementById('postModal').style.display = 'none';
      document.getElementById('post-content-txt').value = '';
      toast('✅ Post publicado exitosamente en LinkedIn', 'success', 5000);
      loadContentPosts();
    } else {
      msg.style.color = 'var(--neon-red)';
      msg.textContent = '❌ ' + (d.error || 'Error al publicar');
    }
  } catch(err) {
    msg.style.color = 'var(--neon-red)';
    msg.textContent = '❌ Backend no disponible: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Publicar ahora en LinkedIn';
  }
}

function savePostLocal() {
  const text = document.getElementById('post-content-txt')?.value.trim();
  if (!text || text.length < 5) return;
  DATA.scheduledPosts.unshift({ id:'p-'+Date.now(), date:'Borrador · ' + new Date().toLocaleDateString('es-AR'), type:'Borrador', text });
  document.getElementById('postModal').style.display = 'none';
  document.getElementById('post-content-txt').value = '';
  toast('Borrador guardado', 'info');
  loadContentPosts();
}

function loadContentPosts() {
  const list = document.getElementById('postsList');
  const label = document.getElementById('postCountLabel');
  if (!list) return;
  if (!DATA.scheduledPosts.length) {
    list.innerHTML = `<div style="text-align:center;padding:30px"><div style="font-size:32px;margin-bottom:10px">✍️</div><div style="font-size:14px;font-weight:600;margin-bottom:6px">Todavía no publicaste nada</div><div style="font-size:12px;color:var(--text-3)">Clic en "Nuevo post" para publicar en LinkedIn</div></div>`;
    if (label) label.textContent = '0 posts publicados';
    return;
  }
  if (label) label.textContent = DATA.scheduledPosts.length + ' post(s)';
  list.innerHTML = DATA.scheduledPosts.map(p=>`<div class="post-item">
    <div class="post-date">📅 ${p.date}</div>

// ── LinkedIn account helpers ─────────────────────────────────────────────────
async function loadLinkedInAccounts() {
  const status = document.getElementById('liAccountStatus');
  const form   = document.getElementById('liConnectForm');
  if (!status) return;
  try {
    const r = await fetch(LI_API + '/accounts', { signal: AbortSignal.timeout(3000) });
    const accounts = await r.json();
    if (!Array.isArray(accounts) || !accounts.length) {
      status.innerHTML = '<div style="font-size:13px;color:var(--text-3);padding:8px 0">No hay cuentas conectadas aún.</div>';
      if (form) form.style.display = 'block';
      return;
    }
    status.innerHTML = accounts.map(a => `
      <div style="display:flex;align-items:center;gap:12px;padding:12px;background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.2);border-radius:10px;margin-bottom:8px">
        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0077b5,#00a0dc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0">${a.initials||'?'}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${a.name}</div>
          <div style="font-size:11px;color:#10b981;margin-top:2px">● Activa · ${(a.stats&&a.stats.actionsToday)||0} acciones hoy</div>
        </div>
        <button onclick="deleteLinkedInAccount('${a.id}')" style="padding:5px 10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;color:#f87171;font-size:11px;cursor:pointer">Desconectar</button>
      </div>`).join('');
    if (form) form.style.display = accounts.length < 3 ? 'block' : 'none';
    if (form && accounts.length >= 3) {
      status.innerHTML += '<button onclick="document.getElementById(\'liConnectForm\').style.display=\'block\'" style="font-size:12px;color:var(--neon-blue);cursor:pointer;background:none;border:none">+ Agregar otra cuenta</button>';
    }
  } catch (err) {
    status.innerHTML = '<div style="font-size:12px;color:var(--neon-amber)">⚠️ Backend no disponible. Corré "node server.js" en la terminal.</div>';
    if (form) form.style.display = 'none';
  }
}

async function connectLinkedIn() {
  const cookie = document.getElementById('liCookieInput')?.value.trim();
  const msg    = document.getElementById('liConnectMsg');
  const btn    = document.getElementById('liConnectBtn');
  if (!cookie || cookie.length < 50) { if(msg){msg.style.color='var(--neon-red)';msg.textContent='Pegá el valor completo de li_at (empieza con AQE...)';} return; }
  if(btn){btn.disabled=true;btn.textContent='Verificando sesión en LinkedIn...';}
  if(msg){msg.textContent='';}
  try {
    const r = await fetch(LI_API + '/accounts/connect', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ cookie }) });
    const d = await r.json();
    if (!r.ok || d.error) { if(msg){msg.style.color='var(--neon-red)';msg.textContent='Error: '+(d.error||'Cookie invalida');} return; }
    toast('Cuenta de LinkedIn conectada: ' + d.name, 'success', 4000);
    if(document.getElementById('liCookieInput')) document.getElementById('liCookieInput').value='';
    loadLinkedInAccounts();
  } catch(err) {
    if(msg){msg.style.color='var(--neon-red)';msg.textContent='Error: '+err.message;}
  } finally {
    if(btn){btn.disabled=false;btn.textContent='🔗 Conectar cuenta de LinkedIn';}
  }
}

async function deleteLinkedInAccount(id) {
  if (!confirm('Desconectar esta cuenta?')) return;
  try { await fetch(LI_API + '/accounts/' + id, { method:'DELETE' }); loadLinkedInAccounts(); } catch {}
}
