          <div style="width:42px;height:42px;border-radius:10px;background:rgba(16,185,129,0.12);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🤝</div>
          <div><div style="font-size:15px;font-weight:700">Conectar con usuario</div><div style="font-size:12px;color:var(--text-2)">Envía solicitud de conexión con nota</div></div>
        </div>
        <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px">Cuenta</div>
        <select id="auto-connect-acc" style="width:100%;padding:9px 12px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-0);font-size:13px"></select>
        <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;margin-top:12px">URL del perfil</div>
        <input id="auto-connect-url" type="url" style="width:100%;padding:9px 12px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-0);font-size:13px" placeholder="https://www.linkedin.com/in/nombre/">
        <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;margin-top:12px">Nota opcional</div>
        <textarea id="auto-connect-note" rows="2" style="width:100%;padding:9px 12px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-0);font-size:13px;resize:vertical" placeholder="Hola, vi tu perfil y me gustaria conectar..."></textarea>
        <button class="btn btn-primary" style="width:100%;margin-top:14px;background:linear-gradient(135deg,#059669,#10b981)" id="btn-auto-connect" onclick="runAutoAction('connect')">🤝 Enviar solicitud</button>
        <div class="auto-result" id="res-auto-connect" style="display:none;margin-top:10px;padding:10px;border-radius:8px;font-size:12px"></div>
      </div>

    </div>
  </div>`;
  checkAutoStatus();
  fillAutoAccounts();
}

async function checkAutoStatus() {
  const dot = document.getElementById('autoDot');
  const txt = document.getElementById('autoStatusTxt');
  if (!dot) return;
  try {
    const r = await fetch(LI_API + '/health', { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    if (d.automationsReady) {
      dot.style.background = '#10b981'; dot.style.boxShadow = '0 0 6px #10b981';
      txt.textContent = 'Backend listo · Playwright activo · ' + (d.activeAccounts||0) + ' cuenta(s)';
    } else {
      dot.style.background = '#f59e0b';
      txt.textContent = 'Backend conectado pero sin Playwright';
    }
  } catch {
    dot.style.background = '#ef4444';
    txt.textContent = 'Backend no disponible — corré node server.js';
  }
}

async function fillAutoAccounts() {
  try {
    const r = await fetch(LI_API + '/accounts');
    const accounts = await r.json();
    ['like','post','comment','connect'].forEach(k => {
      const sel = document.getElementById('auto-' + k + '-acc');
      if (!sel) return;
      if (!Array.isArray(accounts) || !accounts.length) {
        sel.innerHTML = '<option value="">— Sin cuentas. Ir a Conectores —</option>';
      } else {
        sel.innerHTML = accounts.map(a => '<option value="' + a.id + '">' + a.name + (a.status==='active'?' ✅':' ⚠️') + '</option>').join('');
      }
    });
  } catch {}
}

async function runAutoAction(type) {
  const map = { like:'like', post:'post', comment:'comment', connect:'connect' };
  const accId  = document.getElementById('auto-'+type+'-acc')?.value;
  const btn    = document.getElementById('btn-auto-'+type);
  const resEl  = document.getElementById('res-auto-'+type);
  if (!accId) { showAutoResult(type,'Primero conectá una cuenta en Conectores',false); return; }

  let body = { accountId: accId };
  if (type==='like') {
    body.action = 'likeFromFeed';
    body.limit  = parseInt(document.getElementById('auto-like-n')?.value)||5;
  } else if (type==='post') {
    const txt = document.getElementById('auto-post-txt')?.value.trim();
    if (!txt||txt.length<10){showAutoResult(type,'El post necesita al menos 10 caracteres',false);return;}
    body.action = 'publishPost'; body.text = txt;
  } else if (type==='comment') {
    const url = document.getElementById('auto-comment-url')?.value.trim();
    const txt = document.getElementById('auto-comment-txt')?.value.trim();
    if (!url){showAutoResult(type,'Ingresa la URL del post',false);return;}
    if (!txt){showAutoResult(type,'Escribi un comentario',false);return;}
    body.action='commentPost'; body.postUrl=url; body.text=txt;
  } else if (type==='connect') {
    const url = document.getElementById('auto-connect-url')?.value.trim();
    if (!url||!url.includes('linkedin.com/in/')){showAutoResult(type,'URL de perfil invalida (linkedin.com/in/...)',false);return;}
    body.action='sendConnectionRequest'; body.profileUrl=url;
    body.note = document.getElementById('auto-connect-note')?.value.trim()||'';
  }

  if(btn){btn.disabled=true;btn.textContent='Ejecutando en LinkedIn... (30-60 seg)';}
  if(resEl){resEl.style.display='none';}

  try {
    const r = await fetch(LI_API+'/automations/run-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    if (d.ok||(d.liked!==undefined&&d.liked>=0)) {
      const msg = d.liked!==undefined ? d.liked+' likes dados en el feed' : 'Accion completada exitosamente';
      showAutoResult(type,'✅ '+msg,true);
      toast(msg,'success');
    } else {
      showAutoResult(type,'❌ '+(d.error||'Error desconocido'),false);
    }
  } catch(err) {
    showAutoResult(type,'❌ '+err.message,false);
  } finally {
    if (btn) {
      btn.disabled=false;
      const labels={like:'👍 Dar Likes ahora',post:'✍️ Publicar en LinkedIn',comment:'💬 Comentar ahora',connect:'🤝 Enviar solicitud'};
      btn.textContent=labels[type]||'Ejecutar';
    }
  }
}

function showAutoResult(type, msg, ok) {
  const el = document.getElementById('res-auto-'+type);
  if (!el) return;
  el.style.display='block';
  el.style.background = ok ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)';
  el.style.border = ok ? '1px solid rgba(16,185,129,0.25)' : '1px solid rgba(239,68,68,0.25)';
  el.style.color = ok ? '#34d399' : '#f87171';
  el.textContent = msg;
}

// ============================================
// ADMIN VIEW
// ============================================
function renderAdmin(container) {
  if (!AUTH.isAdmin()) { toast('Acceso denegado','info'); return; }
  const users = AUTH.allUsers();
  container.innerHTML = `<div class="view">
    <div class="view-header">
      <div><h1 class="view-title">Administración</h1><p class="view-subtitle">Gestión de usuarios y accesos · Solo administradores</p></div>
    </div>
    <div class="admin-grid">
      <div class="card">
        <div class="card-title" style="margin-bottom:16px">👥 Usuarios del sistema <span style="font-size:12px;color:var(--text-2);font-weight:400">(${users.length} total)</span></div>
        <table class="users-table">
          <thead><tr><th>Usuario</th><th>Nombre</th><th>Empresa</th><th>Rol</th><th>Alta</th><th></th></tr></thead>
          <tbody id="usersTableBody">
            ${users.map(u => `<tr>
              <td><code style="font-size:12px;color:var(--neon-cyan)">${u.username}</code></td>
              <td style="font-weight:600">${u.name}</td>
              <td style="color:var(--text-2)">${u.company||'—'}</td>
              <td><span class="role-badge ${u.role}">${u.role}</span></td>
              <td style="color:var(--text-3);font-size:11px">${new Date(u.createdAt).toLocaleDateString('es-AR')}</td>
              <td>${u.role!=='admin'?`<button class="btn btn-ghost" style="font-size:11px;color:var(--neon-red)" onclick="if(confirm('¿Eliminar a ${u.name}?')){AUTH.deleteUser('${u.id}');renderAdmin(document.getElementById('viewContainer'))}">✕ Eliminar</button>`:'<span style="color:var(--text-3);font-size:11px">Admin</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="new-user-form">
        <div class="card-title" style="margin-bottom:18px">➕ Crear nuevo usuario</div>
        <div class="form-row"><label>Nombre completo</label><input class="form-input" id="newName" placeholder="Ana García" /></div>
        <div class="form-row"><label>Usuario (login)</label><input class="form-input" id="newUsername" placeholder="ana.garcia" /></div>
        <div class="form-row"><label>Empresa</label><input class="form-input" id="newCompany" placeholder="Care Assistance" /></div>
        <div class="form-row"><label>Contraseña inicial</label><input class="form-input" id="newPassword" type="password" placeholder="Mínimo 8 caracteres" /></div>
        <div class="form-row"><label>Rol</label><select class="form-select form-input" id="newRole"><option value="user">Usuario</option><option value="admin">Administrador</option></select></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" id="createUserBtn">Crear usuario</button>
        <div id="createUserMsg" style="font-size:12px;margin-top:10px;text-align:center"></div>
      </div>
    </div>
  </div>`;

  document.getElementById('createUserBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const username = document.getElementById('newUsername').value.trim();
    const company = document.getElementById('newCompany').value.trim();
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;
    const msg = document.getElementById('createUserMsg');
    if (!name||!username||!password) { msg.style.color='var(--neon-red)'; msg.textContent='Completá nombre, usuario y contraseña'; return; }
    if (password.length < 8) { msg.style.color='var(--neon-red)'; msg.textContent='La contraseña debe tener al menos 8 caracteres'; return; }
    const res = await AUTH.createUser(name, username, password, role, company);
    if (res.ok) {
      msg.style.color='var(--neon-green)'; msg.textContent=`✓ Usuario "${username}" creado exitosamente`;
      ['newName','newUsername','newCompany','newPassword'].forEach(id=>document.getElementById(id).value='');
      setTimeout(()=>renderAdmin(container), 1200);
    } else {
      msg.style.color='var(--neon-red)'; msg.textContent=res.error;
    }
  });
}

// ============================================
// ROUTER + BOOTSTRAP
// ============================================
const views = { dashboard:renderDashboard, campaigns:renderCampaigns, inbox:renderInbox, leads:renderLeads, content:renderContent, skills:renderSkills, connectors:renderConnectors, automations:renderAutomations, admin:renderAdmin };
const container = document.getElementById('viewContainer');

function navigate(name){
  const view=views[name];if(!view)return;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===name));
  document.getElementById('sidebar').classList.remove('open');
  view(container);
  history.replaceState(null,'','#'+name);
}

// Inject admin nav item if admin user
function injectAdminNav() {
  const nav = document.querySelector('.sidebar-nav');
  if (!nav || !AUTH.isAdmin()) return;
  const btn = document.createElement('button');
  btn.className = 'nav-item';
  btn.dataset.view = 'admin';
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>Usuarios</span><span class="role-badge admin" style="font-size:10px">Admin</span>`;
  btn.addEventListener('click', () => navigate('admin'));
  nav.appendChild(btn);
}

// Update sidebar profile card with real session data
function updateSidebarProfile() {
  const user = AUTH.current();
  if (!user) return;
  const initials = user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const el = id => document.getElementById(id);
  if (el('sidebarAvatar')) el('sidebarAvatar').textContent = initials;
  if (el('sidebarName')) el('sidebarName').textContent = user.name;
  if (el('sidebarRole')) el('sidebarRole').textContent = `${user.role === 'admin' ? '⭐ Admin' : 'Usuario'} · ${user.company || 'LinkedIn Manager'}`;
}

// ── Startup ───────────────────────────────────────────────────────────────────
(async () => {
  await AUTH.init();
  const session = AUTH.current();
  if (!session) { await AUTH.showLogin(); return; }

  // Wired in — setup app
  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.view)));
  document.getElementById('mobileMenuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('newCampaignBtn')?.addEventListener('click',()=>{navigate('campaigns');setTimeout(()=>toast('Click en "Nueva campaña" para abrir el editor','info'),400);});
  document.addEventListener('keydown',(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.querySelector('.search-box input')?.focus();}});

  injectAdminNav();
  updateSidebarProfile();

  const initial = location.hash.slice(1)||'dashboard';
  navigate(views[initial]?initial:'dashboard');
  const firstName = session.name.split(' ')[0];
  setTimeout(()=>toast(`Bienvenido de vuelta, ${firstName} 👋`,'success',3500),600);
})();
</script>
