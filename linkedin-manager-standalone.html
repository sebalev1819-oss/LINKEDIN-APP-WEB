<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkedIn Manager — Sebastián Levin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-0:#07080c;--bg-1:#0b0d14;--bg-2:#11141e;--bg-3:#171b28;--bg-hover:#1e2333;
  --glass-bg:rgba(23,27,40,.6);--glass-border:rgba(255,255,255,.08);--glass-border-strong:rgba(255,255,255,.14);
  --text-0:#f5f7fb;--text-1:#c7ccda;--text-2:#8a91a6;--text-3:#565d73;
  --neon-blue:#4f8cff;--neon-purple:#a855f7;--neon-cyan:#22d3ee;--neon-pink:#f472b6;--neon-green:#34d399;--neon-amber:#fbbf24;--neon-red:#f87171;
  --grad-primary:linear-gradient(135deg,#4f8cff 0%,#a855f7 100%);
  --grad-secondary:linear-gradient(135deg,#22d3ee 0%,#4f8cff 100%);
  --grad-success:linear-gradient(135deg,#34d399 0%,#22d3ee 100%);
  --grad-warm:linear-gradient(135deg,#f472b6 0%,#fbbf24 100%);
  --grad-glow:radial-gradient(circle at 20% 20%,rgba(79,140,255,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 50%);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --shadow-glow-blue:0 0 24px rgba(79,140,255,.35);--shadow-glow-purple:0 0 24px rgba(168,85,247,.35);
  --sidebar-w:260px;--topbar-h:72px;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --ease-out:cubic-bezier(.22,1,.36,1);--t-fast:150ms;--t-med:280ms;--t-slow:500ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg-0);color:var(--text-0);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:var(--grad-glow);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,var(--bg-1),var(--bg-0));border-right:1px solid var(--glass-border);display:flex;flex-direction:column;padding:24px 16px 16px;position:relative}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--neon-blue),transparent);opacity:.25}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;margin-bottom:16px;border-bottom:1px solid var(--glass-border)}
.brand-logo{width:40px;height:40px;border-radius:var(--radius-md);background:var(--grad-primary);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-glow-blue);flex-shrink:0}
.brand-logo svg{width:22px;height:22px}
.brand-title{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);color:var(--text-1);font-size:14px;font-weight:500;transition:all var(--t-fast) var(--ease-out);position:relative;overflow:hidden}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item span:not(.nav-badge){flex:1;text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--text-0);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(168,85,247,.12));color:var(--text-0);box-shadow:inset 0 0 0 1px rgba(79,140,255,.35)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--grad-primary);border-radius:0 3px 3px 0;box-shadow:var(--shadow-glow-blue)}
.nav-badge{background:var(--bg-3);color:var(--text-2);font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.nav-badge.neon{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-glow-blue)}
.sidebar-footer{margin-top:16px;padding-top:16px;border-top:1px solid var(--glass-border)}
.profile-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-md);background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid var(--glass-border);transition:all var(--t-fast) var(--ease-out)}
.profile-card:hover{border-color:var(--glass-border-strong);background:var(--bg-hover)}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;box-shadow:var(--shadow-glow-blue)}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-role{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-settings{color:var(--text-2);padding:6px;border-radius:6px;transition:all var(--t-fast) var(--ease-out)}
.profile-settings svg{width:16px;height:16px}
.profile-settings:hover{color:var(--text-0);background:var(--bg-3);transform:rotate(60deg)}

.main-content{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--topbar-h);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--glass-border);background:rgba(11,13,20,.7);backdrop-filter:blur(20px);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:16px;flex:1;max-width:540px}
.topbar-right{display:flex;align-items:center;gap:12px}
.search-box{flex:1;position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:14px;width:16px;height:16px;color:var(--text-2);pointer-events:none}
.search-box input{width:100%;padding:11px 14px 11px 42px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:13px;color:var(--text-0);transition:all var(--t-fast) var(--ease-out)}
.search-box input:focus{outline:none;border-color:var(--neon-blue);background:var(--bg-3);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.search-box input::placeholder{color:var(--text-3)}
.search-box kbd{position:absolute;right:12px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;background:var(--bg-3);border:1px solid var(--glass-border);border-radius:5px;color:var(--text-2)}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-2);border:1px solid var(--glass-border);color:var(--text-1);display:flex;align-items:center;justify-content:center;position:relative;transition:all var(--t-fast) var(--ease-out)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--bg-3);color:var(--text-0);border-color:var(--glass-border-strong);transform:translateY(-1px)}
.mobile-menu{display:none}
.notif-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--neon-pink);box-shadow:0 0 8px var(--neon-pink);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;transition:all var(--t-fast) var(--ease-out);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-glow-blue),var(--shadow-md)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow-purple),var(--shadow-lg)}
.btn-secondary{background:var(--bg-2);color:var(--text-0);border:1px solid var(--glass-border)}
.btn-secondary:hover{background:var(--bg-3);border-color:var(--glass-border-strong)}
.btn-ghost{color:var(--text-1);padding:8px 12px}
.btn-ghost:hover{color:var(--text-0);background:var(--bg-hover)}
.view-container{flex:1;overflow-y:auto;padding:32px;position:relative}
.view{animation:fadeInUp var(--t-med) var(--ease-out)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.view-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.view-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.view-subtitle{font-size:14px;color:var(--text-2)}
.view-actions{display:flex;gap:10px;align-items:center}

.card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:22px;transition:all var(--t-med) var(--ease-out);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glass-border-strong),transparent)}
.card:hover{border-color:var(--glass-border-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-subtitle{font-size:12px;color:var(--text-2)}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.metric-card{position:relative;overflow:hidden}
.metric-icon{width:42px;height:42px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.metric-icon svg{width:20px;height:20px;color:#fff}
.metric-icon.blue{background:var(--grad-primary);box-shadow:var(--shadow-glow-blue)}
.metric-icon.cyan{background:var(--grad-secondary);box-shadow:0 0 24px rgba(34,211,238,.3)}
.metric-icon.green{background:var(--grad-success);box-shadow:0 0 24px rgba(52,211,153,.3)}
.metric-icon.warm{background:var(--grad-warm);box-shadow:0 0 24px rgba(244,114,182,.3)}
.metric-label{font-size:12px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.metric-value{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px;font-variant-numeric:tabular-nums}
.metric-delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px}
.metric-delta.up{color:var(--neon-green);background:rgba(52,211,153,.12)}
.metric-delta.down{color:var(--neon-red);background:rgba(248,113,113,.12)}
.metric-spark{position:absolute;right:16px;bottom:16px;width:90px;height:38px;opacity:.7}

.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.chart-card{height:320px;display:flex;flex-direction:column}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.chart-body{flex:1;position:relative}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.activity-list{display:flex;flex-direction:column;gap:12px;max-height:260px;overflow-y:auto;padding-right:4px}
.activity-item{display:flex;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);transition:all var(--t-fast) var(--ease-out);border-left:2px solid transparent}
.activity-item:hover{background:var(--bg-hover);border-left-color:var(--neon-blue)}
.activity-icon{width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.activity-body{flex:1;min-width:0}
.activity-text{font-size:13px;color:var(--text-1);line-height:1.4}
.activity-text strong{color:var(--text-0);font-weight:600}
.activity-time{font-size:11px;color:var(--text-3);margin-top:2px}

.campaigns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.campaign-card{display:flex;flex-direction:column;gap:16px}
.campaign-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.campaign-name{font-size:16px;font-weight:600;margin-bottom:4px}
.campaign-desc{font-size:12px;color:var(--text-2);line-height:1.5}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.status-pill::before{content:'';width:6px;height:6px;border-radius:50%}
.status-pill.active{background:rgba(52,211,153,.12);color:var(--neon-green)}
.status-pill.active::before{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);animation:pulse 2s ease-in-out infinite}
.status-pill.paused{background:rgba(251,191,36,.12);color:var(--neon-amber)}
.status-pill.paused::before{background:var(--neon-amber)}
.status-pill.draft{background:rgba(138,145,166,.12);color:var(--text-2)}
.status-pill.draft::before{background:var(--text-2)}
.campaign-steps{display:flex;gap:8px;padding:12px;background:rgba(7,8,12,.5);border-radius:var(--radius-sm)}
.step-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:6px;background:var(--bg-2);font-size:10px;color:var(--text-2);text-align:center}
.step-chip svg{width:14px;height:14px}
.step-chip.done{color:var(--neon-green);background:rgba(52,211,153,.08)}
.step-chip.active{color:var(--neon-blue);background:rgba(79,140,255,.12);box-shadow:inset 0 0 0 1px var(--neon-blue)}
.campaign-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--glass-border)}
.stat-mini{text-align:center}
.stat-mini-val{font-size:17px;font-weight:700}
.stat-mini-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.campaign-progress{height:6px;background:var(--bg-3);border-radius:10px;overflow:hidden}
.campaign-progress-bar{height:100%;background:var(--grad-primary);border-radius:10px;box-shadow:0 0 12px rgba(79,140,255,.6);transition:width var(--t-slow) var(--ease-out)}

.inbox-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;height:calc(100vh - var(--topbar-h) - 64px - 90px);min-height:520px}
@media(max-width:1100px){.inbox-layout{grid-template-columns:1fr}}
.inbox-list{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.inbox-filters{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--glass-border);overflow-x:auto}
.filter-chip{padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-2);border-radius:20px;background:var(--bg-2);white-space:nowrap;transition:all var(--t-fast) var(--ease-out)}
.filter-chip:hover{color:var(--text-0)}
.filter-chip.active{color:#fff;background:var(--grad-primary);box-shadow:var(--shadow-glow-blue)}
.inbox-threads{flex:1;overflow-y:auto}
.thread-item{display:flex;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--glass-border);transition:all var(--t-fast) var(--ease-out);position:relative;width:100%;text-align:left}
.thread-item:hover{background:var(--bg-hover)}
.thread-item.active{background:rgba(79,140,255,.08)}
.thread-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-primary)}
.thread-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;border:1px solid var(--glass-border)}
.thread-body{flex:1;min-width:0}
.thread-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.thread-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-time{font-size:11px;color:var(--text-3);flex-shrink:0;margin-left:8px}
.thread-preview{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.thread-item.unread .thread-name{color:var(--neon-blue)}
.thread-item.unread .thread-preview{color:var(--text-1);font-weight:500}
.inbox-detail{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden}
.detail-header{padding:18px 22px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;gap:14px}
.detail-user{display:flex;gap:12px;align-items:center}
.detail-name{font-size:15px;font-weight:600}
.detail-title{font-size:12px;color:var(--text-2);margin-top:2px}
.detail-messages{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.msg-bubble{max-width:75%;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;line-height:1.5}
.msg-bubble.incoming{background:var(--bg-3);color:var(--text-1);border-bottom-left-radius:4px}
.msg-bubble.outgoing{background:var(--grad-primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:var(--shadow-glow-blue)}
.msg-time{font-size:10px;color:var(--text-3);margin-top:4px}
.detail-compose{padding:16px 22px;border-top:1px solid var(--glass-border);display:flex;gap:10px;align-items:flex-end}
.compose-input{flex:1;min-height:44px;max-height:140px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:13px;resize:none;transition:all var(--t-fast) var(--ease-out)}
.compose-input:focus{outline:none;border-color:var(--neon-blue);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.quick-templates{display:flex;gap:6px;padding:0 22px 14px;flex-wrap:wrap}
.template-chip{padding:5px 10px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:20px;font-size:11px;color:var(--text-2);transition:all var(--t-fast) var(--ease-out)}
.template-chip:hover{color:var(--neon-cyan);border-color:var(--neon-cyan)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:16px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(260px,1fr))}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;min-height:400px}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--glass-border);margin-bottom:12px}
.col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.col-title .dot{width:8px;height:8px;border-radius:50%}
.col-new .dot{background:var(--neon-blue);box-shadow:0 0 8px var(--neon-blue)}
.col-contacted .dot{background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.col-engaged .dot{background:var(--neon-purple);box-shadow:0 0 8px var(--neon-purple)}
.col-won .dot{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.col-count{font-size:11px;color:var(--text-2);padding:2px 8px;background:var(--bg-3);border-radius:10px}
.kanban-cards{display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.lead-card{padding:14px;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:var(--radius-md);cursor:grab;transition:all var(--t-fast) var(--ease-out)}
.lead-card:hover{border-color:var(--glass-border-strong);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.lead-card:active{cursor:grabbing}
.lead-head{display:flex;gap:10px;margin-bottom:10px}
.lead-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad-secondary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0}
.lead-name{font-size:13px;font-weight:600}
.lead-company{font-size:11px;color:var(--text-2);margin-top:1px}
.lead-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:2px 7px;font-size:10px;border-radius:4px;font-weight:500}

function spark(values, color) {
  const w=90,h=38,pad=2,max=Math.max(...values),min=Math.min(...values),range=max-min||1,step=(w-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>`${pad+i*step},${h-pad-((v-min)/range)*(h-pad*2)}`).join(' ');
  const id = color.slice(1);
  return `<svg class="metric-spark" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.4"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" points="${pts}"/><polygon fill="url(#g-${id})" points="${pts} ${w-pad},${h-pad} ${pad},${h-pad}"/></svg>`;
}
function lineChart(data) {
  const w=640,h=220,pad={top:20,right:20,bottom:30,left:36},plotW=w-pad.left-pad.right,plotH=h-pad.top-pad.bottom;
  const series=[{values:data.connections,color:'#4f8cff'},{values:data.messages,color:'#a855f7'},{values:data.views,color:'#22d3ee'}];
  const allVals=series.flatMap(s=>s.values),max=Math.max(...allVals)*1.15,step=plotW/(data.labels.length-1);
  let grid='';
  for(let i=0;i<=4;i++){const y=pad.top+(plotH/4)*i;const v=Math.round(max-(max/4)*i);grid+=`<line x1="${pad.left}" y1="${y}" x2="${w-pad.right}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2,4"/><text x="${pad.left-8}" y="${y+4}" text-anchor="end" fill="#565d73" font-size="10" font-family="Inter">${v}</text>`;}
  let xlabels='';data.labels.forEach((lbl,i)=>{const x=pad.left+i*step;xlabels+=`<text x="${x}" y="${h-8}" text-anchor="middle" fill="#8a91a6" font-size="11" font-family="Inter" font-weight="500">${lbl}</text>`;});
  let paths='';series.forEach((s,idx)=>{const pts=s.values.map((v,i)=>({x:pad.left+i*step,y:pad.top+plotH-(v/max)*plotH}));const d=pts.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');const area=`${d} L${pts[pts.length-1].x},${pad.top+plotH} L${pts[0].x},${pad.top+plotH} Z`;paths+=`<path d="${area}" fill="url(#area-${idx})" opacity="0.25"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;pts.forEach(p=>{paths+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${s.color}" stroke="#11141e" stroke-width="1.5"/>`;});});
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;"><defs><linearGradient id="area-0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#4f8cff"/><stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/></linearGradient><linearGradient id="area-1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="area-2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>${grid}${paths}${xlabels}</svg>`;
}
function metricCard({label,value,delta,trend,iconClass,icon}){
  const isUp=delta>=0;
  const c=iconClass==='blue'?'#4f8cff':iconClass==='cyan'?'#22d3ee':iconClass==='green'?'#34d399':'#f472b6';
  return `<div class="card metric-card"><div class="metric-icon ${iconClass}">${icon}</div><div class="metric-label">${label}</div><div class="metric-value">${value.toLocaleString('es-AR')}</div><div class="metric-delta ${isUp?'up':'down'}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="${isUp?'18 15 12 9 6 15':'6 9 12 15 18 9'}"/></svg>${isUp?'+':''}${delta}% vs sem. pasada</div>${spark(trend,c)}</div>`;
}

function campaignCard(c){

  </div>`;

function renderCampaigns(container){
  container.innerHTML=`<div class="view">
    <div class="view-header">
      <div><h1 class="view-title">Campañas</h1><p class="view-subtitle">Secuencias automatizadas de outreach B2B</p></div>

// INBOX VIEW

let inboxState = { filter:'all', activeId:null };
function renderInbox(container){
  const filtered = inboxState.filter==='all'?DATA.threads:DATA.threads.filter(t=>t.filter===inboxState.filter);
  if(!inboxState.activeId||!filtered.find(t=>t.id===inboxState.activeId)){inboxState.activeId=filtered[0]?.id||null;}
  const active = filtered.find(t=>t.id===inboxState.activeId);
  container.innerHTML=`<div class="view">
    <div class="view-header"><div><h1 class="view-title">Smart Inbox</h1><p class="view-subtitle">Bandeja centralizada de tus conversaciones de LinkedIn</p></div></div>
    <div class="inbox-layout">
      <div class="inbox-list">
        <div class="inbox-filters" id="inboxFilters">
          ${['all','prospects','customers','partners'].map(f=>`<button class="filter-chip ${inboxState.filter===f?'active':''}" data-filter="${f}">${f==='all'?'Todos':f==='prospects'?'Prospectos':f==='customers'?'Clientes':'Partners'}</button>`).join('')}
        </div>
        <div class="inbox-threads" id="threadsList">
          ${filtered.map(t=>`<button class="thread-item ${t.unread?'unread':''} ${inboxState.activeId===t.id?'active':''}" data-id="${t.id}"><div class="thread-avatar">${t.initials}</div><div class="thread-body"><div class="thread-head"><div class="thread-name">${t.name}</div><div class="thread-time">${t.time}</div></div><div class="thread-preview">${t.preview}</div></div></button>`).join('')}
        </div>
      </div>
      <div class="inbox-detail" id="inboxDetail">
        ${active?`
          <div class="detail-header">
            <div class="detail-user"><div class="thread-avatar">${active.initials}</div><div><div class="detail-name">${active.name}</div><div class="detail-title">${active.title}</div></div></div>
            <div style="display:flex;gap:8px;"><button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button><button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button></div>
          </div>
          <div class="detail-messages" id="detailMessages">${active.messages.map(m=>`<div class="msg-bubble ${m.dir==='in'?'incoming':'outgoing'}">${m.text}<div class="msg-time">${m.time}</div></div>`).join('')}</div>
          <div class="quick-templates">${DATA.quickTemplates.map(t=>`<button class="template-chip" data-template="${t}">${t}</button>`).join('')}</div>
          <div class="detail-compose">
            <textarea class="compose-input" id="composeInput" placeholder="Escribí tu mensaje..." rows="1"></textarea>
            <button class="btn btn-primary" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Enviar</button>
          </div>
        `:'<div class="empty">Seleccioná una conversación</div>'}
      </div>
    </div>
  </div>`;
  container.querySelector('#inboxFilters').addEventListener('click',(e)=>{const b=e.target.closest('.filter-chip');if(!b)return;inboxState.filter=b.dataset.filter;inboxState.activeId=null;renderInbox(container);});
  container.querySelector('#threadsList').addEventListener('click',(e)=>{const it=e.target.closest('.thread-item');if(!it)return;inboxState.activeId=it.dataset.id;renderInbox(container);});
  if(active){
    const msgs=container.querySelector('#detailMessages');msgs.scrollTop=msgs.scrollHeight;
    const input=container.querySelector('#composeInput');
    container.querySelector('#sendBtn').addEventListener('click',()=>{const v=input.value.trim();if(!v)return;active.messages.push({dir:'out',text:v,time:'ahora'});active.preview=v.slice(0,60);renderInbox(container);toast('Mensaje enviado','success');});
    input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();container.querySelector('#sendBtn').click();}});
    container.querySelectorAll('.template-chip').forEach(c=>c.addEventListener('click',()=>{input.value=c.dataset.template;input.focus();}));
  }
}

// LEADS VIEW
// ============================================
const kanbanCols = [
  { key:'new', title:'Nuevos', cls:'col-new' },
  { key:'contacted', title:'Contactados', cls:'col-contacted' },
  { key:'engaged', title:'Interesados', cls:'col-engaged' },
  { key:'won', title:'Cerrados', cls:'col-won' },
];
const tagLabel = (t)=>({hr:'HR',ceo:'CEO',latam:'LATAM',wellness:'Wellness'})[t]||t;
function leadCard(l){return `<div class="lead-card" draggable="true" data-id="${l.id}"><div class="lead-head"><div class="lead-avatar">${l.initials}</div><div style="flex:1;min-width:0;"><div class="lead-name">${l.name}</div><div class="lead-company">${l.company}</div></div></div><div class="lead-tags">${l.tags.map(t=>`<span class="tag ${t}">${tagLabel(t)}</span>`).join('')}</div><div class="lead-foot"><span>${l.time}</span><span class="lead-score"><span class="heat">★</span><span>${l.score}</span></span></div></div>`;}
function renderLeads(container){
  container.innerHTML=`<div class="view">
    <div class="view-header"><div><h1 class="view-title">Leads CRM</h1><p class="view-subtitle">Pipeline visual de prospectos B2B · Arrastrá para mover</p></div><div class="view-actions"><button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir lead</button></div></div>
    <div class="kanban" id="kanban">${kanbanCols.map(c=>`<div class="kanban-col ${c.cls}" data-col="${c.key}"><div class="kanban-col-header"><div class="col-title"><span class="dot"></span>${c.title}</div><div class="col-count">${DATA.leads[c.key].length}</div></div><div class="kanban-cards">${DATA.leads[c.key].map(leadCard).join('')}</div></div>`).join('')}</div>
  </div>`;
  const kanban=container.querySelector('#kanban');
  let draggingId=null,sourceCol=null;
  kanban.addEventListener('dragstart',(e)=>{const c=e.target.closest('.lead-card');if(!c)return;draggingId=c.dataset.id;sourceCol=c.closest('.kanban-col').dataset.col;c.style.opacity='0.4';});
  kanban.addEventListener('dragend',(e)=>{const c=e.target.closest('.lead-card');if(c)c.style.opacity='';});
  kanban.addEventListener('dragover',(e)=>{const col=e.target.closest('.kanban-col');if(!col)return;e.preventDefault();col.style.background='rgba(79,140,255,0.08)';});
  kanban.addEventListener('dragleave',(e)=>{const col=e.target.closest('.kanban-col');if(col)col.style.background='';});
  kanban.addEventListener('drop',(e)=>{const col=e.target.closest('.kanban-col');if(!col||!draggingId)return;e.preventDefault();col.style.background='';const to=col.dataset.col;if(to===sourceCol)return;const lead=DATA.leads[sourceCol].find(l=>l.id===draggingId);if(lead){DATA.leads[sourceCol]=DATA.leads[sourceCol].filter(l=>l.id!==draggingId);DATA.leads[to].push(lead);}renderLeads(container);toast(`Lead movido a ${kanbanCols.find(c=>c.key===to).title}`,'success');draggingId=null;sourceCol=null;});
}

// ============================================
// ROUTER + BOOTSTRAP
// ============================================
const views = { dashboard:renderDashboard, campaigns:renderCampaigns, inbox:renderInbox, leads:renderLeads, content:renderContent };
const container = document.getElementById('viewContainer');
const navItems = document.querySelectorAll('.nav-item');

function navigate(name){
  const view=views[name];if(!view)return;
  navItems.forEach(n=>n.classList.toggle('active',n.dataset.view===name));
  document.getElementById('sidebar').classList.remove('open');
  view(container);
  history.replaceState(null,'','#'+name);
}

navItems.forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.view)));
document.getElementById('mobileMenuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('newCampaignBtn')?.addEventListener('click',()=>{navigate('campaigns');setTimeout(()=>toast('Click en "Nueva campaña" para abrir el editor','info'),400);});
document.addEventListener('keydown',(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.querySelector('.search-box input')?.focus();}});

const initial=location.hash.slice(1)||'dashboard';
navigate(views[initial]?initial:'dashboard');
setTimeout(()=>toast('Bienvenido de vuelta, Sebastián 👋','success',3500),600);
</script>
